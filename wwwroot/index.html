<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <title></title>
</head>

<body>

  <h1> Files Browser </h1>

  <!-- Display the current directory path or search status -->

  <h3 id="pathHeader"></h3>

  <!-- total size -->

  <p id="summaryStats"></p>

  <!-- Input for query -->

  <input type="text" id="searchInput" placeholder="Enter query">

  <!-- buttons to reset and to search -->
  <button onclick="performSearch()">Search</button>
  <button onclick="loadFolder('')">Return to root folder </button>

  <!-- File Upload -->
  <div style="margin: 15px 0;">
    <input type="file" id="fileUploadInput">
    <button onclick="uploadFile()">Upload File </button>
  </div>

  <!-- table to display query results -->
  <table>
    <thead>
      <tr>
        <th scope="col">Type</th>
        <th scope="col">Name</th>
        <th scope="col">Size</th>
        <th scope="col">Last Modified</th>
        <th scope="col">Action</th>
      </tr>
    </thead>

    <!-- append rows here -->
    <tbody id="fileTableBody"></tbody>
  </table>

  <script src="./app.js"></script>
</body>

</html>
